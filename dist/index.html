<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08110f" />
  <title>掌心密匣 PalmVault</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308110f'/%3E%3Cpath d='M18 29V22c0-9 5-15 14-15s14 6 14 15v7' fill='none' stroke='%2367e8c5' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='12' y='26' width='40' height='31' rx='10' fill='%2367e8c5'/%3E%3Ccircle cx='32' cy='40' r='4' fill='%2308110f'/%3E%3Cpath d='M32 43v7' stroke='%2308110f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #08110f;
      --panel: #0d1916;
      --panel-2: #13231f;
      --line: rgba(226, 255, 246, .09);
      --text: #edf8f4;
      --muted: #91a9a0;
      --brand: #67e8c5;
      --brand-soft: rgba(103, 232, 197, .12);
      --warning: #f3c969;
      --danger: #ff7b86;
      --shadow: 0 30px 80px rgba(0,0,0,.34);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 78% 10%, rgba(32,115,94,.22), transparent 34%), var(--bg); color: var(--text); font-family: Inter, "HarmonyOS Sans SC", "PingFang SC", system-ui, sans-serif; font-size: 16px; }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0,1fr); }
    .sidebar { border-right: 1px solid var(--line); background: rgba(6,15,13,.78); backdrop-filter: blur(24px); padding: 26px 18px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 28px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 13px; background: var(--brand); color: #07110e; display: grid; place-items: center; box-shadow: 0 8px 26px rgba(103,232,197,.18); }
    .brand strong { display:block; font-size: 17px; letter-spacing: .02em; }
    .brand small { color: var(--muted); font-size: 12px; }
    .nav-label { color: #657b73; font-size: 12px; letter-spacing: .13em; padding: 8px 12px; }
    .nav { display:grid; gap: 5px; }
    .nav button { width:100%; border:0; background:transparent; color:var(--muted); display:flex; gap:12px; align-items:center; padding:11px 12px; border-radius:12px; cursor:pointer; text-align:left; }
    .nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .nav button.active { background: var(--brand-soft); color: var(--brand); }
    .nav svg { width:19px; height:19px; flex:none; }
    .nav .count { margin-left:auto; color:#6f8b81; font-size:12px; }
    .storage { margin-top:auto; padding:15px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.025); }
    .storage-top { display:flex; align-items:center; justify-content:space-between; font-size:13px; }
    .storage-top span:last-child { color:var(--muted); }
    .progress { height:5px; background:#1e302b; border-radius:8px; margin-top:12px; overflow:hidden; }
    .progress i { display:block; width:18%; height:100%; background:linear-gradient(90deg,var(--brand),#b4ffe9); border-radius:inherit; }
    .main { padding: 28px 34px 56px; min-width:0; }
    .topbar { display:flex; align-items:center; gap:16px; }
    .search { flex:1; max-width:720px; height:48px; border:1px solid var(--line); background:rgba(17,32,28,.78); border-radius:15px; display:flex; align-items:center; gap:11px; padding:0 15px; box-shadow:0 10px 35px rgba(0,0,0,.12); }
    .search svg { width:20px; color:#7f9d92; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--text); }
    .search input::placeholder { color:#769087; }
    .kbd { border:1px solid var(--line); border-bottom-color:rgba(255,255,255,.18); border-radius:7px; padding:3px 7px; color:#789087; font-size:12px; }
    .icon-btn { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel); cursor:pointer; }
    .avatar { background:linear-gradient(145deg,#254a40,#142720); color:var(--brand); font-weight:700; }
    .hero { margin-top:36px; display:flex; justify-content:space-between; gap:24px; align-items:flex-end; }
    .hero h1 { font-size:30px; margin:0 0 8px; letter-spacing:-.03em; }
    .hero p { margin:0; color:var(--muted); }
    .primary { border:0; background:var(--brand); color:#07110e; font-weight:720; padding:12px 17px; border-radius:13px; display:flex; align-items:center; gap:8px; cursor:pointer; box-shadow:0 12px 28px rgba(103,232,197,.16); }
    .primary:hover { filter:brightness(1.05); transform:translateY(-1px); }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:26px; }
    .metric { min-height:124px; border:1px solid var(--line); background:linear-gradient(145deg,rgba(21,38,33,.96),rgba(12,25,21,.86)); border-radius:18px; padding:18px; position:relative; overflow:hidden; }
    .metric::after { content:""; position:absolute; width:100px; height:100px; right:-45px; top:-50px; border-radius:50%; background:var(--glow,rgba(103,232,197,.1)); filter:blur(4px); }
    .metric-head { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; }
    .metric-icon { width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.05); display:grid; place-items:center; }
    .metric strong { display:block; margin-top:12px; font-size:27px; }
    .metric small { color:#6f8b81; font-size:12px; }
    .section-head { margin-top:34px; display:flex; align-items:center; justify-content:space-between; }
    .section-head h2 { margin:0; font-size:18px; }
    .section-head button { border:0; background:transparent; color:var(--brand); cursor:pointer; }
    .recent { margin-top:14px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .card { border:1px solid var(--line); background:rgba(15,29,25,.82); border-radius:18px; padding:17px; cursor:pointer; transition:.2s ease; min-width:0; }
    .card:hover { transform:translateY(-2px); border-color:rgba(103,232,197,.25); background:#11231e; }
    .card-top { display:flex; align-items:center; gap:12px; }
    .item-icon { width:42px; height:42px; border-radius:13px; display:grid; place-items:center; font-weight:800; background:#1d332c; color:var(--brand); }
    .item-icon.blue { background:#162c39; color:#75d7ff; }
    .item-icon.gold { background:#332b19; color:#f4cf73; }
    .card-title { min-width:0; flex:1; }
    .card-title strong, .card-title span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .card-title span { color:var(--muted); font-size:13px; margin-top:3px; }
    .more { color:#728a81; font-size:20px; }
    .card-foot { border-top:1px solid var(--line); margin-top:15px; padding-top:13px; color:#6f8b81; font-size:12px; display:flex; justify-content:space-between; }
    .groups { margin-top:14px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .group { border:1px solid var(--line); border-radius:16px; padding:16px; background:rgba(13,26,22,.72); display:flex; align-items:center; gap:12px; cursor:pointer; }
    .group:hover { background:#12241f; }
    .folder { width:38px; height:38px; border-radius:12px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; }
    .group strong { display:block; font-size:14px; }
    .group span { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
    .mobile-nav { display:none; }
    @media (max-width: 1050px) { .metrics{grid-template-columns:repeat(2,1fr)} .recent{grid-template-columns:repeat(2,1fr)} .groups{grid-template-columns:repeat(2,1fr)} }
    .hidden { display:none !important; }
    .page { animation: pageIn .24s ease; }
    @keyframes pageIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
    .page-title { margin-top:34px; display:flex; gap:20px; align-items:flex-end; justify-content:space-between; }
    .page-title h1 { margin:0 0 7px; font-size:30px; letter-spacing:-.03em; }
    .page-title p { margin:0; color:var(--muted); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .secondary, .danger-btn { border:1px solid var(--line); background:var(--panel); padding:11px 15px; border-radius:12px; cursor:pointer; }
    .secondary:hover { border-color:rgba(103,232,197,.28); background:var(--panel-2); }
    .danger-btn { color:var(--danger); border-color:rgba(255,123,134,.18); }
    .filterbar { margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:15px; }
    .pills { display:flex; gap:8px; overflow:auto; padding-bottom:2px; }
    .pill { white-space:nowrap; border:1px solid var(--line); background:transparent; color:var(--muted); padding:8px 12px; border-radius:999px; cursor:pointer; font-size:14px; }
    .pill.active { color:var(--brand); background:var(--brand-soft); border-color:rgba(103,232,197,.18); }
    .vault-list { margin-top:16px; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:rgba(13,26,22,.72); }
    .list-head, .vault-row { display:grid; grid-template-columns:minmax(220px,1.5fr) minmax(120px,.7fr) minmax(110px,.65fr) 70px; align-items:center; gap:12px; }
    .list-head { color:#69837a; font-size:12px; padding:12px 18px; border-bottom:1px solid var(--line); }
    .vault-row { padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer; }
    .vault-row:last-child { border-bottom:0; }
    .vault-row:hover { background:rgba(103,232,197,.035); }
    .item-main { display:flex; align-items:center; gap:12px; min-width:0; }
    .item-main div:last-child { min-width:0; }
    .item-main strong, .item-main span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-main span, .cell-muted { color:var(--muted); font-size:13px; margin-top:3px; }
    .type-tag { color:#b0c4bc; font-size:13px; }
    .row-more { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:20px; }
    .split { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; margin-top:24px; }
    .panel { border:1px solid var(--line); border-radius:19px; background:rgba(13,26,22,.75); padding:20px; }
    .panel h2, .panel h3 { margin:0; }
    .panel h2 { font-size:18px; }
    .panel h3 { font-size:15px; }
    .security-score { display:flex; align-items:center; gap:25px; }
    .score-ring { width:132px; height:132px; flex:none; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--brand) 0 86%,#20332d 86% 100%); position:relative; }
    .score-ring::after { content:""; position:absolute; inset:10px; border-radius:50%; background:#0f1d19; }
    .score-ring div { position:relative; z-index:1; text-align:center; }
    .score-ring strong { display:block; font-size:30px; }
    .score-ring span { color:var(--muted); font-size:12px; }
    .check-list { display:grid; gap:0; margin-top:16px; }
    .check-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
    .check-icon { width:34px; height:34px; border-radius:11px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; }
    .check-icon.warn { background:rgba(243,201,105,.11); color:var(--warning); }
    .check-row div:nth-child(2) { flex:1; }
    .check-row strong, .check-row span { display:block; }
    .check-row span { color:var(--muted); font-size:13px; margin-top:3px; }
    .status { font-size:12px; color:var(--brand); }
    .timeline { margin-top:15px; display:grid; gap:16px; }
    .timeline-row { display:grid; grid-template-columns:12px 1fr; gap:11px; }
    .dot { width:8px; height:8px; margin-top:5px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 5px var(--brand-soft); }
    .timeline-row strong, .timeline-row span { display:block; font-size:13px; }
    .timeline-row span { color:var(--muted); margin-top:3px; font-size:12px; }
    .backup-hero { margin-top:24px; border:1px solid rgba(103,232,197,.16); border-radius:22px; background:linear-gradient(125deg,rgba(103,232,197,.13),rgba(13,26,22,.75) 48%); padding:26px; display:flex; align-items:center; gap:20px; }
    .backup-art { width:72px; height:72px; border-radius:22px; background:var(--brand); color:#091510; display:grid; place-items:center; font-size:28px; flex:none; }
    .backup-hero div:nth-child(2) { flex:1; }
    .backup-hero h2 { margin:0 0 7px; }
    .backup-hero p { margin:0; color:var(--muted); }
    .backup-meta { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:20px; }
    .mini-stat { border:1px solid var(--line); border-radius:14px; padding:14px; background:rgba(0,0,0,.1); }
    .mini-stat span, .mini-stat strong { display:block; }
    .mini-stat span { color:var(--muted); font-size:12px; }
    .mini-stat strong { margin-top:5px; font-size:14px; }
    .trash-note { margin-top:22px; padding:14px 16px; border-radius:14px; background:rgba(243,201,105,.08); color:#dfc47d; font-size:14px; border:1px solid rgba(243,201,105,.12); }
    .group-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px; }
    .group-card { min-height:165px; border:1px solid var(--line); border-radius:18px; background:rgba(13,26,22,.78); padding:19px; cursor:pointer; }
    .group-card:hover { border-color:rgba(103,232,197,.25); transform:translateY(-2px); }
    .group-card .folder { margin-bottom:22px; }
    .group-card strong { display:block; }
    .group-card p { color:var(--muted); font-size:13px; margin:6px 0 0; }
    .group-card .group-bottom { display:flex; justify-content:space-between; margin-top:19px; color:#759087; font-size:12px; }
    .switch { width:44px; height:25px; border-radius:20px; background:#263a34; padding:3px; cursor:pointer; transition:.2s; flex:none; }
    .switch::after { content:""; display:block; width:19px; height:19px; border-radius:50%; background:#82968f; transition:.2s; }
    .switch.on { background:var(--brand); }
    .switch.on::after { transform:translateX(19px); background:#07110e; }
    .settings-grid { margin-top:22px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .setting-section { border:1px solid var(--line); border-radius:18px; overflow:hidden; background:rgba(13,26,22,.75); }
    .setting-section h2 { font-size:15px; padding:17px 18px; margin:0; border-bottom:1px solid var(--line); }
    .setting-row { display:flex; align-items:center; gap:13px; padding:15px 18px; border-bottom:1px solid var(--line); }
    .setting-row:last-child { border-bottom:0; }
    .setting-row > div:nth-child(2) { flex:1; }
    .setting-row strong, .setting-row span { display:block; }
    .setting-row strong { font-size:14px; }
    .setting-row span { color:var(--muted); font-size:12px; margin-top:3px; }
    .setting-row .chev { color:#6d847c; }
    .ocr-chip { display:inline-flex; align-items:center; gap:5px; border-radius:7px; padding:3px 7px; color:#78d9bd; background:rgba(103,232,197,.08); font-size:11px; }
    .media-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:18px; }
    .media-card { aspect-ratio:1/1; border-radius:16px; overflow:hidden; border:1px solid var(--line); position:relative; cursor:pointer; background:#14251f; }
    .media-card .media-visual { position:absolute; inset:0; background:linear-gradient(145deg,#33483f,#0c1714); display:grid; place-items:center; color:rgba(255,255,255,.7); font-size:34px; }
    .media-card:nth-child(2) .media-visual { background:linear-gradient(145deg,#263b51,#101a26); }
    .media-card:nth-child(3) .media-visual { background:linear-gradient(145deg,#624b34,#1d1712); }
    .media-card:nth-child(4) .media-visual { background:linear-gradient(145deg,#3e354f,#15121c); }
    .media-info { position:absolute; left:0; right:0; bottom:0; padding:30px 11px 10px; background:linear-gradient(transparent,rgba(0,0,0,.78)); font-size:12px; }
    .media-info span { display:block; color:#c0d0ca; margin-top:3px; }
    .modal-backdrop { position:fixed; z-index:50; inset:0; background:rgba(1,7,5,.72); backdrop-filter:blur(8px); display:grid; place-items:center; padding:20px; }
    .modal { width:min(560px,100%); max-height:min(760px,calc(100vh - 35px)); overflow:auto; border:1px solid rgba(255,255,255,.12); background:#0f1e1a; border-radius:22px; box-shadow:var(--shadow); }
    .modal.wide { width:min(760px,100%); }
    .modal-head { position:sticky; z-index:2; top:0; display:flex; align-items:center; justify-content:space-between; padding:19px 21px; background:rgba(15,30,26,.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .modal-head h2 { font-size:18px; margin:0; }
    .close { border:0; width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.05); cursor:pointer; color:var(--muted); }
    .modal-body { padding:21px; }
    .type-picker { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .type-option { border:1px solid var(--line); background:rgba(255,255,255,.02); border-radius:14px; padding:14px 8px; text-align:center; cursor:pointer; color:var(--muted); }
    .type-option span { display:block; font-size:23px; margin-bottom:7px; color:var(--brand); }
    .type-option.active { color:var(--text); border-color:rgba(103,232,197,.34); background:var(--brand-soft); }
    .form { display:grid; gap:15px; margin-top:20px; }
    .field { display:grid; gap:7px; }
    .field label { color:#afc2bb; font-size:13px; }
    .input, .textarea, .select { width:100%; border:1px solid var(--line); background:#0a1613; color:var(--text); border-radius:12px; padding:12px 13px; outline:0; }
    .textarea { min-height:95px; resize:vertical; }
    .input:focus, .textarea:focus, .select:focus { border-color:rgba(103,232,197,.42); box-shadow:0 0 0 3px rgba(103,232,197,.06); }
    .modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:17px 21px; border-top:1px solid var(--line); }
    .toast { position:fixed; z-index:90; right:24px; bottom:24px; background:#ecfff8; color:#0a1713; border-radius:13px; padding:13px 16px; box-shadow:var(--shadow); font-size:14px; animation:toastIn .25s ease; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px) } }
    .drawer-wrap { position:fixed; z-index:45; inset:0; background:rgba(0,0,0,.46); }
    .drawer { position:absolute; right:0; top:0; bottom:0; width:min(490px,100%); background:#0d1b17; border-left:1px solid var(--line); box-shadow:var(--shadow); overflow:auto; animation:slideIn .25s ease; }
    @keyframes slideIn { from { transform:translateX(100%) } }
    .drawer-cover { padding:24px; background:linear-gradient(145deg,rgba(103,232,197,.16),transparent); border-bottom:1px solid var(--line); }
    .drawer-cover .item-icon { width:58px; height:58px; border-radius:17px; font-size:21px; }
    .drawer-cover h2 { margin:16px 0 4px; font-size:23px; }
    .drawer-cover p { margin:0; color:var(--muted); }
    .drawer-body { padding:22px 24px; }
    .detail-field { padding:13px 0; border-bottom:1px solid var(--line); }
    .detail-field label { display:block; color:#6f887f; font-size:12px; margin-bottom:5px; }
    .detail-value { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .detail-value code { color:var(--text); font-family:inherit; word-break:break-all; }
    .tiny-btn { border:0; background:var(--brand-soft); color:var(--brand); border-radius:8px; padding:6px 9px; cursor:pointer; font-size:12px; }
    .history { margin-top:24px; }
    .history h3 { font-size:14px; }
    .history-entry { margin-top:12px; padding:12px; border-radius:12px; background:rgba(255,255,255,.025); color:var(--muted); font-size:12px; display:flex; justify-content:space-between; }
    .search-overlay { position:fixed; z-index:60; inset:0; background:rgba(3,10,8,.78); backdrop-filter:blur(12px); padding:6vh 20px; }
    .search-dialog { width:min(720px,100%); margin:auto; border:1px solid rgba(255,255,255,.12); background:#10201b; border-radius:22px; box-shadow:var(--shadow); overflow:hidden; }
    .search-big { display:flex; gap:12px; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
    .search-big input { flex:1; background:transparent; border:0; outline:0; color:var(--text); font-size:17px; }
    .search-results { padding:10px; max-height:62vh; overflow:auto; }
    .result { display:flex; gap:12px; padding:12px; border-radius:13px; cursor:pointer; }
    .result:hover { background:rgba(103,232,197,.06); }
    .result > div:nth-child(2) { flex:1; }
    .result strong, .result p { display:block; margin:0; }
    .result p { color:var(--muted); font-size:13px; margin-top:4px; }
    mark { color:var(--brand); background:transparent; }
    .result-type { color:#738c83; font-size:12px; }
    .empty { padding:42px 18px; color:var(--muted); text-align:center; line-height:1.8; }
    .empty > div { font-size:28px; color:#587069; }
    .lock-screen { position:fixed; z-index:100; inset:0; background:radial-gradient(circle at 50% 30%,rgba(47,121,101,.23),transparent 30%),#07100d; display:grid; place-items:center; padding:20px; }
    .lock-card { text-align:center; width:min(380px,100%); }

  <div class="lock-screen hidden" id="lockScreen"><div class="lock-card"><div class="lock-logo">◆</div><h1>掌心密匣已锁定</h1><p>使用人脸、指纹或主密码解锁本地保险库</p><button class="bio-btn" id="bioUnlock">◎ 使用生物认证解锁</button><div class="pass-row"><input class="input" id="unlockPassword" type="password" placeholder="输入主密码（演示：123456）" /><button class="secondary" id="passwordUnlock">解锁</button></div><small style="display:block;color:#61776f;margin-top:18px">由 User Authentication Kit 提供系统级认证</small></div></div>

  <script>
    const items = [

    const homeView = () => `<section class="page"><section class="hero"><div><h1>下午好，欢迎回来</h1><p>资料保存在应用私有目录，最近备份于今天 09:42。</p></div><button class="primary" data-action="new"><span>＋</span> 新建项目</button></section><section class="metrics" aria-label="保险库统计"><article class="metric"><div class="metric-head"><span>账号密码</span><div class="metric-icon">⌘</div></div><strong>12</strong><small>2 个弱密码待处理</small></article><article class="metric" style="--glow:rgba(117,215,255,.12)"><div class="metric-head"><span>私密笔记</span><div class="metric-icon">✎</div></div><strong>8</strong><small>本周新增 3 条</small></article><article class="metric" style="--glow:rgba(244,207,115,.12)"><div class="metric-head"><span>照片与视频</span><div class="metric-icon">▧</div></div><strong>8</strong><small>已识别 326 段文字</small></article><article class="metric" style="--glow:rgba(255,123,134,.1)"><div class="metric-head"><span>本地资料</span><div class="metric-icon">✓</div></div><strong>86</strong><small>仅用于交互原型展示</small></article></section><div class="section-head"><h2>最近使用</h2><button data-view="items">查看全部 →</button></div><section class="recent">${items.slice(0,3).map(item=>`<article class="card" data-item="${item.id}"><div class="card-top"><div class="item-icon ${item.class}">${item.icon}</div><div class="card-title"><strong>${item.name}</strong><span>${item.sub}</span></div><span class="more">···</span></div><div class="card-foot"><span>${item.type}</span><span>${item.updated}</span></div></article>`).join('')}</section><div class="section-head"><h2>我的分组</h2><button data-view="groups">管理分组 →</button></div><section class="groups">${groups.slice(0,4).map(g=>`<article class="group" data-view="groups"><div class="folder" style="color:${g.color};background:${g.bg}">◆</div><div><strong>${g.name}</strong><span>${g.count} 个项目</span></div></article>`).join('')}</section></section>`;
    const itemsView = () => { const filtered=currentFilter==='全部'?items:items.filter(i=>i.type===currentFilter || (currentFilter==='媒体' && ['图片','视频'].includes(i.type))); return `<section class="page"><div class="page-title"><div><h1>全部项目</h1><p>28 个本地项目，保存在应用私有目录。</p></div><button class="primary" data-action="new">＋ 新建项目</button></div><div class="filterbar"><div class="pills">${['全部','账号密码','私密笔记','媒体'].map(x=>`<button class="pill ${currentFilter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><button class="secondary" data-action="sort">↕ 最近修改</button></div>${itemRows(filtered)}${currentFilter==='媒体'?`<div class="section-head"><h2>媒体预览</h2><span class="ocr-chip">✓ 图片文字均已建立索引</span></div><div class="media-grid">${items.filter(i=>i.type==='图片').map(i=>`<article class="media-card" data-item="${i.id}"><div class="media-visual">${i.icon}</div><div class="media-info"><strong>${i.name}</strong><span>${i.ocr.slice(0,16)}…</span></div></article>`).join('')}</div>`:''}</section>`; };
    const groupsView = () => `<section class="page"><div class="page-title"><div><h1>我的分组</h1><p>按自己的习惯组织账号、资料与媒体。</p></div><button class="primary" data-action="newGroup">＋ 新建分组</button></div><div class="group-grid">${groups.map(g=>`<article class="group-card" data-group="${g.name}"><div class="folder" style="color:${g.color};background:${g.bg}">◆</div><strong>${g.name}</strong><p>${g.desc}</p><div class="group-bottom"><span>${g.count} 个项目</span><span>打开 →</span></div></article>`).join('')}</div></section>`;
    const securityView = () => `<section class="page"><div class="page-title"><div><h1>安全中心</h1><p>检查密码健康度与保险库保护状态。</p></div><button class="secondary" data-action="scan">重新检查</button></div><div class="split"><section class="panel"><div class="security-score"><div class="score-ring"><div><strong>86</strong><span>安全评分</span></div></div><div><h2>整体状况良好</h2><p style="color:var(--muted);line-height:1.6">处理 2 个弱密码后可进一步提升安全性。</p></div></div><div class="check-list"><div class="check-row"><div class="check-icon">✓</div><div><strong>全局锁已启用</strong><span>人脸 / 指纹 + 主密码</span></div><span class="status">已保护</span></div><div class="check-row"><div class="check-icon">✓</div><div><strong>敏感页面防截屏</strong><span>查看详情、编辑与搜索结果页</span></div><span class="status">已启用</span></div><div class="check-row"><div class="check-icon warn">!</div><div><strong>发现 2 个弱密码</strong><span>GitHub 工作账号、网银登录</span></div><button class="tiny-btn" data-view="items">去处理</button></div><div class="check-row"><div class="check-icon">✓</div><div><strong>本地数据加密</strong><span>AES-256-GCM · 密钥受系统安全区保护</span></div><span class="status">正常</span></div></div></section><aside class="panel"><h2>最近安全活动</h2><div class="timeline"><div class="timeline-row"><i class="dot"></i><div><strong>生物认证解锁成功</strong><span>今天 14:26 · 当前设备</span></div></div><div class="timeline-row"><i class="dot"></i><div><strong>加密备份已创建</strong><span>今天 09:42 · 1.8 GB</span></div></div><div class="timeline-row"><i class="dot"></i><div><strong>主密码已验证</strong><span>昨天 20:11</span></div></div></div><button class="secondary" style="width:100%;margin-top:22px" data-view="settings">管理安全设置</button></aside></div></section>`;
    const trashView = () => `<section class="page"><div class="page-title"><div><h1>回收站</h1><p>删除的项目保留 30 天，之后将从设备永久移除。</p></div><button class="danger-btn" data-action="emptyTrash">清空回收站</button></div><div class="trash-note">回收站中的项目仍保持加密，并计入本地存储空间。</div>${itemRows(trashItems).replaceAll('data-item=','data-trash=')}</section>`;
    const backupView = () => `<section class="page"><div class="page-title"><div><h1>备份与恢复</h1><p>将整个保险库导出为独立加密文件。</p></div></div><section class="backup-hero"><div class="backup-art">⇩</div><div><h2>保险库已备份</h2><p>最近备份：今天 09:42 · PalmVault-2026-09-12.pvbackup</p></div><button class="primary" data-action="backup">立即备份</button></section><div class="backup-meta"><div class="mini-stat"><span>备份大小</span><strong>1.8 GB</strong></div><div class="mini-stat"><span>包含内容</span><strong>28 个项目 · 146 个附件</strong></div><div class="mini-stat"><span>加密方式</span><strong>AES-256-GCM</strong></div></div><div class="split"><section class="panel"><h2>创建备份</h2><p style="color:var(--muted);line-height:1.65">导出所有本地数据，以便迁移设备或长期保存。备份文件使用独立密码加密。</p><button class="primary" data-action="backup">选择保存位置</button></section><section class="panel"><h2>从备份恢复</h2><p style="color:var(--muted);line-height:1.65">读取 PalmVault 加密备份，可选择合并或替换当前保险库。</p><button class="secondary" data-action="restore">选择备份文件</button></section></div></section>`;
    const settingsView = () => `<section class="page"><div class="page-title"><div><h1>设置</h1><p>管理解锁方式、隐私保护与本地存储。</p></div></div><div class="settings-grid"><section class="setting-section"><h2>安全与隐私</h2><div class="setting-row"><div class="check-icon">◎</div><div><strong>人脸 / 指纹解锁</strong><span>User Authentication Kit</span></div><div class="switch on" role="switch" aria-checked="true"></div></div><div class="setting-row"><div class="check-icon">⌁</div><div><strong>自动锁定</strong><span>离开应用 1 分钟后</span></div><span class="chev">›</span></div><div class="setting-row"><div class="check-icon">▧</div><div><strong>禁止截屏</strong><span>所有敏感详情页面</span></div><div class="switch on" role="switch" aria-checked="true"></div></div><div class="setting-row"><div class="check-icon">••</div><div><strong>更改主密码</strong><span>上次更改于 38 天前</span></div><span class="chev">›</span></div></section><section class="setting-section"><h2>本地数据</h2><div class="setting-row"><div class="check-icon">◎</div><div><strong>图片文字识别</strong><span>导入时离线建立 OCR 索引</span></div><div class="switch on" role="switch" aria-checked="true"></div></div><div class="setting-row"><div class="check-icon">⇩</div><div><strong>备份与恢复</strong><span>最近备份：今天 09:42</span></div><span class="chev">›</span></div><div class="setting-row"><div class="check-icon">▦</div><div><strong>存储空间</strong><span>已使用 1.8 GB</span></div><span class="chev">›</span></div><div class="setting-row"><div class="check-icon">⌫</div><div><strong>回收站保留时间</strong><span>30 天</span></div><span class="chev">›</span></div></section><section class="setting-section"><h2>体验</h2><div class="setting-row"><div class="check-icon">◐</div><div><strong>外观</strong><span>跟随系统</span></div><span class="chev">›</span></div><div class="setting-row"><div class="check-icon">中</div><div><strong>语言</strong><span>简体中文</span></div><span class="chev">›</span></div><div class="setting-row"><div class="check-icon">↯</div><div><strong>减少动态效果</strong><span>保持界面动画</span></div><div class="switch" role="switch" aria-checked="false"></div></div></section><section class="setting-section"><h2>关于</h2><div class="setting-row"><div class="check-icon">◆</div><div><strong>掌心密匣 PalmVault</strong><span>原型版本 0.1 · HarmonyOS 5.0+</span></div></div><div class="setting-row"><div class="check-icon">i</div><div><strong>隐私说明</strong><span>无云端、无追踪、无第三方上传</span></div><span class="chev">›</span></div></section></div></section>`;
    const views={home:homeView,items:itemsView,groups:groupsView,security:securityView,trash:trashView,backup:backupView,settings:settingsView};

    function render(view=currentView){ currentView=view; page.innerHTML=views[view](); document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); window.scrollTo({top:0,behavior:'smooth'}); }
    function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
    function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600); }
    function openItem(id, isTrash=false){ const item=(isTrash?trashItems:items).find(x=>x.id===Number(id)); if(!item)return; const drawer=document.getElementById('drawer'); drawer.innerHTML=`<div class="modal-head"><span class="ocr-chip">▣ 敏感页面 · 已禁止截屏</span><button class="close" id="drawerClose">×</button></div><div class="drawer-cover"><div class="item-icon ${item.class}">${item.icon}</div><h2>${item.name}</h2><p>${item.group} · ${item.type}</p></div><div class="drawer-body">${isTrash?`<p style="color:var(--muted)">${item.sub}。恢复后将回到“${item.group}”分组。</p><div class="actions"><button class="primary" id="restoreItem">恢复项目</button><button class="danger-btn" id="deleteForever">永久删除</button></div>`:`${item.user?`<div class="detail-field"><label>账号</label><div class="detail-value"><code>${item.user}</code><button class="tiny-btn" data-copy="账号">复制</button></div></div>`:''}${item.pass?`<div class="detail-field"><label>密码</label><div class="detail-value"><code id="passValue">${item.pass}</code><button class="tiny-btn" id="revealPass">显示</button></div></div>`:''}${item.url?`<div class="detail-field"><label>网址</label><div class="detail-value"><code>${item.url}</code><button class="tiny-btn" data-copy="网址">复制</button></div></div>`:''}${item.note?`<div class="detail-field"><label>加密内容</label><div class="detail-value"><code>${item.note}</code></div></div>`:''}${item.ocr?`<div class="detail-field"><label>图片中识别的文字 <span class="ocr-chip">OCR</span></label><div class="detail-value"><code>${item.ocr}</code><button class="tiny-btn" data-copy="识别文字">复制</button></div></div>`:''}<div class="history"><h3>修改历史</h3><div class="history-entry"><span>查看当前版本</span><span>${item.updated}</span></div><div class="history-entry"><span>项目已加密创建</span><span>2026年7月</span></div></div>`}</div>`; document.getElementById('drawerWrap').classList.remove('hidden'); document.getElementById('drawerClose').onclick=()=>document.getElementById('drawerWrap').classList.add('hidden'); const reveal=document.getElementById('revealPass'); if(reveal) reveal.onclick=()=>{document.getElementById('passValue').textContent='a8!Vault#2026';reveal.textContent='已显示';}; drawer.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>toast(`${b.dataset.copy}已复制，30 秒后清除剪贴板`)); const restore=document.getElementById('restoreItem'); if(restore)restore.onclick=()=>{document.getElementById('drawerWrap').classList.add('hidden');toast('项目已恢复到原分组');}; const del=document.getElementById('deleteForever');if(del)del.onclick=()=>{document.getElementById('drawerWrap').classList.add('hidden');toast('演示模式：未执行永久删除');}; }
    function showSearch(){ const overlay=document.getElementById('searchOverlay'); overlay.classList.remove('hidden'); const input=document.getElementById('searchInput'); input.value=''; input.focus(); renderSearch(''); }
    function renderSearch(q){
      const box=document.getElementById('searchResults');
      const query=q.trim().toLowerCase();
      const list=query?items.filter(i=>[i.name,i.sub,i.type,i.group,i.note,i.ocr,i.user,i.url].filter(Boolean).join(' ').toLowerCase().includes(query)):items.slice(0,5);
      const label=query?`在全部分组中找到 ${list.length} 项`:'最近使用';
      const results=list.length?list.map(i=>`<div class="result" data-item="${i.id}"><div class="item-icon ${i.class}">${i.icon}</div><div><strong>${i.name} ${i.ocr?'<span class="ocr-chip">OCR 命中</span>':''}</strong><p>${i.ocr||i.note||i.sub}</p></div><span class="result-type">${i.group}</span></div>`).join(''):`<div class="empty"><div>⌕</div>没有找到“${q}”<br><small>试试项目名称、账号或图片中的文字</small></div>`;
      box.innerHTML=`<div style="padding:7px 12px;color:#6f887f;font-size:12px">${label}</div>${results}`;
    }

    document.addEventListener('click',e=>{
      const view=e.target.closest('[data-view]'); if(view){ render(view.dataset.view); return; }
      const action=e.target.closest('[data-action]'); if(action){ const a=action.dataset.action; if(a==='new')openModal('newModal'); if(a==='newGroup')openModal('groupModal'); if(a==='backup')openModal('backupModal'); if(a==='restore')openModal('restoreModal'); if(a==='scan')toast('安全检查完成，评分保持 86'); if(a==='sort')toast('已按最近修改时间排序'); if(a==='emptyTrash')toast('演示模式：回收站内容已保留'); return; }
      const close=e.target.closest('[data-close]'); if(close){closeModal(close.dataset.close);return;}
      const item=e.target.closest('[data-item]'); if(item){openItem(item.dataset.item);return;}
      const tr=e.target.closest('[data-trash]'); if(tr){openItem(tr.dataset.trash,true);return;}
      const group=e.target.closest('[data-group]'); if(group){currentFilter='全部';render('items');toast(`已打开“${group.dataset.group}”分组`);return;}
      const filter=e.target.closest('[data-filter]'); if(filter){currentFilter=filter.dataset.filter;render('items');return;}
    });
    document.getElementById('searchTrigger').onclick=showSearch;
    document.getElementById('searchClose').onclick=()=>document.getElementById('searchOverlay').classList.add('hidden');
    document.getElementById('searchInput').addEventListener('input',e=>renderSearch(e.target.value));
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch();} if(e.key==='Escape'){document.querySelectorAll('.modal-backdrop,.search-overlay,.drawer-wrap').forEach(x=>x.classList.add('hidden'));}});
    document.getElementById('lockBtn').onclick=()=>document.getElementById('lockScreen').classList.remove('hidden');
    document.getElementById('bioUnlock').onclick=()=>{const b=document.getElementById('bioUnlock');b.textContent='正在验证…';setTimeout(()=>{document.getElementById('lockScreen').classList.add('hidden');b.textContent='◎ 使用生物认证解锁';toast('身份验证成功，保险库已解锁');},800)};
    document.getElementById('passwordUnlock').onclick=()=>{if(document.getElementById('unlockPassword').value==='123456'){document.getElementById('lockScreen').classList.add('hidden');toast('主密码验证成功');}else toast('主密码不正确，演示密码为 123456');};
    document.querySelectorAll('.type-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type-option').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.type;document.getElementById('dynamicFields').innerHTML=['图片','视频'].includes(t)?`<div class="field"><label>导入文件</label><button type="button" class="secondary" onclick="toast('已选择本机文件（原型演示）')">选择本机${t}</button></div>`:t==='账号密码'?`<div class="field"><label>账号</label><input class="input" placeholder="邮箱或用户名" /></div><div class="field"><label>密码</label><input class="input" type="password" value="a8!Vault#2026" /></div>`:`<div class="field"><label>内容</label><textarea class="textarea" placeholder="输入需要加密保存的内容"></textarea></div>`;});
    document.getElementById('newForm').onsubmit=e=>{e.preventDefault();closeModal('newModal');toast('项目已在本机加密保存');e.target.reset();};
    document.getElementById('groupForm').onsubmit=e=>{e.preventDefault();closeModal('groupModal');toast('新分组已创建');e.target.reset();};
    document.querySelectorAll('.switch').forEach(s=>s.onclick=()=>{s.classList.toggle('on');s.setAttribute('aria-checked',s.classList.contains('on'));toast(s.classList.contains('on')?'设置已开启':'设置已关闭');});
    document.getElementById('confirmBackup').onclick=()=>{const b=document.getElementById('confirmBackup');b.textContent='正在加密…';setTimeout(()=>{closeModal('backupModal');b.textContent='创建备份';toast('加密备份已创建并保存到本机');},900)};
    document.getElementById('chooseBackup').onclick=()=>toast('已校验备份文件，下一步可选择合并或替换');
    document.getElementById('drawerWrap').onclick=e=>{if(e.target.id==='drawerWrap')e.currentTarget.classList.add('hidden');};
    render();
  </script>
</body>
</html>
